[project]
name = "ahab-assistant-limbus-company"
description = "Ahab Assistant for Limbus Company: automation helper (GUI, OCR, tasks)."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "KIYI671" }]
keywords = ["limbus", "automation", "appkit", "ocr", "game-assistant"]
requires-python = ">=3.12"
version = "1.0.9"

dependencies = [
    "pyuac~=0.0.3; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
    "PyAutoGUI; sys_platform == 'win32'",
    "pynput",
    "pyperclip",
    "requests",
    "packaging",
    "markdown-it-py",
    "mdit-py-plugins",
    "linkify-it-py",
    "ruamel.yaml",
    "numpy",
    "opencv-python-headless",
    "pillow",
    "psutil",
    "onnxruntime==1.20.1",
    "concurrent-log-handler>=0.9.28",
    "colorlog>=6.9.0",
    "rapidocr>=3.4.1",
    "pyobjc-framework-Vision==11.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==11.1; sys_platform == 'darwin'",
    "tzdata>=2025.2",
    "adbutils>=2.10.2",
    "windows-toasts>=1.3.1; sys_platform == 'win32'",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=9.1.0",
    "ruff>=0.13.1",
]

[project.urls]
Homepage = "https://github.com/KIYI671/AhabAssistantLimbusCompany"
Source = "https://github.com/KIYI671/AhabAssistantLimbusCompany"
Issues = "https://github.com/KIYI671/AhabAssistantLimbusCompany/issues"

[tool.uv]
managed = true
override-dependencies = ["opencv-python; python_version < '0'"]

[tool.ruff.lint]
# 启用规则集 (E: pycodestyle, F: Pyflakes, I: isort)
# T201: 禁止使用print进行调试
select = ["E", "F", "I", "T201"]
# 忽略特定的规则
ignore = ["E501"]
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
